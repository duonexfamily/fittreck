<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:640px;height:640px;overflow:hidden;background:#0b1d26}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#16424a"/>
      <stop offset="0.55" stop-color="#0d2a33"/>
      <stop offset="1" stop-color="#081820"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="250" fill="url(#halo)"/>
  <!-- дорожка кольца прогресса -->
  <circle cx="320" cy="320" r="228" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="20"/>
  <!-- кольцо прогресса ~80% -->
  <circle cx="320" cy="320" r="228" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"
          stroke-dasharray="1146 1433" transform="rotate(-90 320 320)" filter="url(#glow)"/>
  <!-- пульс, переходящий в галочку -->
  <path d="M150 335 H222 L254 268 L292 398 L328 330 L372 378 L494 246"
        fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
</body></html>
